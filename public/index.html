<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathStats - Primeira Regra de Negócio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow border-0">
            <div class="card-header bg-primary text-white text-center py-3">
                <h2 class="mb-0">MathStats - Motor de Desafios</h2>
            </div>
            <div class="card-body text-center p-5">
                <button id="btnGerar" class="btn btn-lg btn-success mb-4 px-5">Gerar Desafio via API</button>

                <div id="areaDesafio" class="d-none">
                    <h4 class="text-secondary mt-3">Problema Matemático:</h4>
                    <p id="pergunta" class="fs-4 fw-bold text-dark my-4"></p>
                    <div class="alert alert-info text-start" id="dica"></div>

                    <div class="input-group input-group-lg my-4">
                        <input type="number" step="0.01" id="inputResposta" class="form-control" placeholder="Digite sua resposta">
                        <button id="btnResponder" class="btn btn-primary">Responder</button>
                    </div>

                    <div id="areaResultado" class="d-none mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let idDesafioAtual = null;
        const API_BASE = '/api';

        document.getElementById('btnGerar').addEventListener('click', async () => {
            const btn = document.getElementById('btnGerar');
            const areaDesafio = document.getElementById('areaDesafio');
            const areaResultado = document.getElementById('areaResultado');

            btn.disabled = true;
            btn.innerText = "Consultando API-Football e gerando matemática...";
            areaDesafio.classList.add('d-none');
            areaResultado.classList.add('d-none');

            try {
                const resposta = await fetch(`${API_BASE}/desafio`);
                const dados = await resposta.json();

                if (dados.pergunta) {
                    idDesafioAtual = dados.idDesafio;
                    document.getElementById('pergunta').innerText = dados.pergunta;
                    document.getElementById('dica').innerText = "Dica: " + dados.dica;
                    document.getElementById('inputResposta').value = '';

                    areaDesafio.classList.remove('d-none');
                    btn.innerText = "Gerar Novo Desafio";
                    btn.disabled = false;
                } else {
                    alert("Erro da API: " + (dados.erro || "Desconhecido"));
                    btn.innerText = "Tentar Novamente";
                    btn.disabled = false;
                }
            } catch (error) {
                console.error(error);
                alert("Erro de conexão. O servidor Node.js está rodando na porta 3000?");
                btn.innerText = "Tentar Novamente";
                btn.disabled = false;
            }
        });

        document.getElementById('btnResponder').addEventListener('click', async () => {
            const input = document.getElementById('inputResposta');
            const areaResultado = document.getElementById('areaResultado');
            const btnResponder = document.getElementById('btnResponder');

            if (!idDesafioAtual || input.value === '') {
                alert("Gere um desafio e digite uma resposta antes de enviar.");
                return;
            }

            btnResponder.disabled = true;
            btnResponder.innerText = "Validando...";

            try {
                const resp = await fetch(`${API_BASE}/desafio/${idDesafioAtual}/responder`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ resposta: Number(input.value) })
                });
                const dados = await resp.json();

                areaResultado.classList.remove('d-none');
                areaResultado.className = `alert mt-3 ${dados.acertou ? 'alert-success' : 'alert-danger'}`;
                areaResultado.innerText = dados.mensagem || (dados.erro ?? "Erro ao validar.");

            } catch (error) {
                console.error(error);
                alert("Erro de conexão ao validar a resposta.");
            } finally {
                btnResponder.disabled = false;
                btnResponder.innerText = "Responder";
            }
        });
    </script>
</body>
</html>
